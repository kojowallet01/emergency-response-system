<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Emergency Responder</title>
  
  <!-- PWA Meta Tags -->
  <meta name="application-name" content="Emergency Responder">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Responder">
  <meta name="description" content="Ghana Emergency Response System - Responder App">
  <meta name="theme-color" content="#667eea">
  
  <!-- PWA Manifest - Responder Only -->
  <link rel="manifest" href="/responder-manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/responder-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/responder-icon-512.png">
  <link rel="apple-touch-icon" href="/responder-icon-192.png">
  
  <!-- Redirect to Next.js responder page -->
  <script>
    // Immediately redirect to the Next.js responder page
    window.location.replace('/responder');
  </script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .loader {
      text-align: center;
    }
    .loader-icon {
      font-size: 4rem;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-icon">🚑</div>
    <p>Loading Responder App...</p>
  </div>
</body>
</html>
