[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "out"

[dev]
  command = "cd frontend && npm run dev"
  port = 3000

# Redirect all non-file requests for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files - they change frequently
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
