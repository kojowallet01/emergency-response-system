services:
  - type: web
    name: emergency-response-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
